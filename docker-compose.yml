services:
  music-bot:
    build: .
    image: ytvc-bot:latest
    container_name: ytvc-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # These MUST win over whatever .env says. A bare-metal .env normally uses
      # relative paths (./data), which inside the container would resolve to
      # /app/data — leaving the volume below unused and silently discarding the
      # library on every rebuild. `environment` takes precedence over `env_file`,
      # so the same .env works for both `python -m bot` and compose.
      DATA_DIR: /data
      AUDIO_DIR: /data/audio
      DB_PATH: /data/library.db
      COOKIES_FILE: /data/cookies.txt
    volumes:
      # mp3s, sqlite library, yt-dlp cache and cookies.txt all live here
      - ./data:/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
